<div class="map-config">
  <!-- <h2>Configuration</h2> -->
  <label>Line width:</label>
  <input id="activity_width" type="range" min="0" max="20" step="1" value="{{this.state.config().activity_width}}" (change)="onChanged($event)">
  <label>Line resolution:</label>
  <input id="activity_resolution" type="range" min="0" max="0.001" step="0.0000001" value="{{this.state.config().activity_resolution}}" (change)="onChanged($event)">
  <label>Metric:</label>
  <select id="activity_metric" value="{{this.state.config().activity_metric}}" (change)="onChanged($event)">
    <option value="heartRate">Heartrate</option>
    <option value="power">Power</option>
    <option value="speed">Speed</option>
    <option value="elevation">Elevation</option>
    <option value="cadence">Cadence</option>
    <option value="temperature">Temperature</option>
  </select>
</div>
