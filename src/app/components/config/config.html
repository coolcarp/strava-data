<div>
  <!-- <h2>Configuration</h2> -->
  <label>threshold:</label>
  <input id="threshold" type="range" min="0" max="1" step="0.01" value="{{this.state.config().threshold}}" (change)="onChanged($event)">
  <label>radius:</label>
  <input id="radius" type="range" min="0" max="100" step="1" value="{{this.state.config().radius}}" (change)="onChanged($event)">
  <label>intensity:</label>
  <input id="intensity" type="range" min="0" max="1" step="0.01" value="{{this.state.config().intensity}}" (change)="onChanged($event)">
  <!-- <label>PROGRESS: {{this.state.ratio() | percent}}</label> -->
</div>
